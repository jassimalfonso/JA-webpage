[data-theme=dark]{--bg:#070707;--card:#101010;--fg:#f4f4f2;--mut:#77777a;--line:rgba(255,255,255,.14);--glow:255,255,255;--ga:1.15}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:var(--bg);transition:background .5s}
body{font-family:'Inter',system-ui,sans-serif;font-weight:300;color:var(--fg);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:800px;margin:-400px 0 0 -640px;overflow:hidden;background:var(--bg);color:var(--fg);transition:background .5s,color .5s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
.cap{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);font-weight:400}

/* top bar */
.top{position:absolute;left:0;right:0;top:0;height:76px;display:flex;align-items:center;padding:0 40px;gap:18px}
.top .sp{flex:1}
.ib{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);transition:box-shadow .3s,border-color .3s,opacity .3s,background .3s,color .3s}
.ib svg{width:18px;height:18px}
.ib:active{box-shadow:0 0 22px rgba(var(--glow),.45);border-color:var(--fg)}
.ib.hide{opacity:0;pointer-events:none}
.crumb{font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-weight:400}
.crumb i{font-style:normal;color:var(--mut)}
.clock{font-size:14px;letter-spacing:.14em;font-weight:400;font-variant-numeric:tabular-nums}
.live{font-size:10px;letter-spacing:.24em;color:var(--mut);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.live b{width:6px;height:6px;border-radius:50%;background:var(--mut)}
.live.on b{background:var(--fg);box-shadow:0 0 10px rgba(var(--glow),.9)}

/* pages */
.view{position:absolute;left:0;right:0;top:76px;bottom:0}
.page{position:absolute;inset:0;opacity:0;transform:translateY(10px);transition:opacity .22s,transform .45s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.page.in{opacity:1;transform:none;pointer-events:auto;transition-delay:.12s}

/* opening */
.open{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .5s;touch-action:none}
.open.up{opacity:0;pointer-events:none;transition:opacity .55s .6s,background .5s}
.frame{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;padding:60px 90px}
.mark{font-size:46px;font-weight:300;letter-spacing:.62em;margin-right:-.62em;white-space:nowrap;text-shadow:0 0 34px rgba(var(--glow),.32)}
.mark span{display:inline-block}
.hl{width:0;height:1px;opacity:0;background:var(--fg);box-shadow:0 0 18px 2px rgba(var(--glow),.8)}
/* intro: letters settle in one by one, the rest follows */
.intro .mark span{animation:ltr 1s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--k)*.065s + .25s)}
@keyframes ltr{from{opacity:0;transform:translateY(18px);filter:blur(7px)}}
@keyframes fin{from{opacity:0}}
.intro .frame .cap{animation:fin 1s 1.6s backwards}
.intro .time,.intro .pill,.intro>.ib{animation:fin 1s 2.1s backwards}
/* enter: the word opens out, the line runs to both edges, the home appears behind it */
.open.up .mark{letter-spacing:1.2em;margin-right:-1.2em;opacity:0;filter:blur(6px);transition:letter-spacing .95s cubic-bezier(.3,0,.2,1),margin .95s cubic-bezier(.3,0,.2,1),opacity .6s .2s,filter .6s .2s}
.open.up .hl{animation:run 1.25s cubic-bezier(.6,0,.2,1) forwards}
@keyframes run{0%{width:0;opacity:0}12%{opacity:1}68%{width:1280px;opacity:1}100%{width:1280px;opacity:0}}
.open.up .cap,.open.up .time,.open.up .hint,.open.up .pill,.open.up>.ib{opacity:0;transition:opacity .3s}
.open .time{position:absolute;top:56px;font-size:15px;letter-spacing:.3em;font-weight:400;font-variant-numeric:tabular-nums}
.open .hint{position:absolute;bottom:54px;display:flex;flex-direction:column;align-items:center;gap:12px;animation:hint 3.2s ease-in-out infinite}
.intro .hint{animation:fin 1s 2.1s backwards,hint 3.2s 3.1s ease-in-out infinite}
.open .hint svg{width:20px;height:20px}
@keyframes hint{50%{opacity:.35;transform:translateY(-5px)}}
.open .ib{position:absolute;right:40px;top:16px}

/* rooms */
.gw{padding:0 56px}
.gh{display:flex;align-items:flex-end;justify-content:space-between;height:84px;padding-bottom:24px}
.gh .hi{font-size:34px;font-weight:300;letter-spacing:-.015em;margin-bottom:10px}
.gb{display:flex;gap:12px}
.pill{height:44px;padding:0 26px;border:1px solid var(--line);border-radius:22px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:400;transition:background .3s,color .3s,box-shadow .4s,border-color .3s}
.pill:active{background:var(--fg);color:var(--bg);border-color:var(--fg);box-shadow:0 0 30px rgba(var(--glow),calc(.5*var(--ga)))}
.page.in .gh{animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:var(--d,0s)}
.rooms{display:flex;gap:26px}
.rc{flex:1;height:560px;background:var(--card);border:1px solid rgba(var(--glow),calc(.07 + var(--gl,0)*.63));display:flex;flex-direction:column;text-align:left;cursor:pointer;transition:transform .45s,background .5s;box-shadow:0 22px 80px -20px rgba(var(--glow),calc(var(--gl,0)*.62*var(--ga)))}
.rc:active{transform:scale(.99)}
.rc.cin{transition:transform .45s,background .5s,box-shadow 1.4s,border-color 1.4s}
.page.in .rc{animation:rise 1s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i)*.1s + .08s + var(--d,0s))}
@keyframes rise{from{opacity:0;transform:translateY(28px)}}
.rc .art{flex:1;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);position:relative}
.rc .art svg{width:170px;height:170px;stroke-width:1;overflow:visible;opacity:calc(.45 + var(--gl,0)*.55)}
.rc.cin .art svg{transition:opacity 1.4s}
.rc .lum{fill:currentColor;stroke:none;opacity:calc(var(--lv,0)*.95)}
.rc .lum.soft{opacity:calc(var(--lv,0)*.15)}
.rc.cin .lum{transition:opacity 1.4s}
.page.in .rc .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s cubic-bezier(.4,0,.2,1) forwards;animation-delay:calc(var(--i)*.14s + .3s + var(--d,0s))}
@keyframes draw{to{stroke-dashoffset:0}}
.rc .ctl{display:flex;align-items:center;gap:16px;margin-top:16px;cursor:default}
.rc .ctl .ib.on{background:var(--fg);color:var(--bg);border-color:var(--fg);box-shadow:0 0 26px rgba(var(--glow),calc(.5*var(--ga)))}
.rc .meta{padding:24px 24px 20px}
.rc .nm{font-size:25px;font-weight:300;letter-spacing:.02em;margin:10px 0 14px}
.rc .st{font-size:13px;color:var(--mut);font-weight:400;letter-spacing:.03em}

/* tabs */
.tabs{display:flex;justify-content:center;gap:54px;height:52px}
.tab{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--mut);font-weight:400;padding:14px 4px;position:relative;transition:color .3s}
.tab.on{color:var(--fg)}
.tab::after{content:'';position:absolute;left:50%;right:50%;bottom:6px;height:1px;background:var(--fg);box-shadow:0 0 12px 1px rgba(var(--glow),.8);opacity:0;transition:left .35s,right .35s,opacity .2s}
.tab.on::after{left:4px;right:4px;opacity:1}
.body{position:absolute;left:0;right:0;top:52px;bottom:0}
.cols{display:flex;gap:56px;padding:34px 72px 0;height:100%}
.col{flex:1;min-width:0}
h3{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);font-weight:400;margin-bottom:20px}

/* slider */
.row{display:flex;align-items:center;gap:22px;height:78px;border-bottom:1px solid var(--line)}
.row .n{width:150px;font-size:17px}
.row .v{width:52px;text-align:right;font-size:14px;font-weight:400;font-variant-numeric:tabular-nums;color:var(--mut)}
.sl{flex:1;height:54px;position:relative;touch-action:none;cursor:pointer}
.sl-line,.sl-fill{position:absolute;left:0;top:50%;height:1px;background:var(--line);width:100%}
.sl-fill{background:var(--fg);height:2px;margin-top:-.5px}
.sl-th{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--fg)}

/* tiles */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid.g4{grid-template-columns:repeat(4,1fr)}
.tile{height:82px;border:1px solid var(--line);background:var(--card);font-size:14px;letter-spacing:.05em;font-weight:400;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .35s,color .35s,box-shadow .45s,border-color .35s}
.tile svg{width:18px;height:18px}
.tile:active{border-color:var(--fg)}
.tile.on{background:var(--fg);color:var(--bg);border-color:var(--fg);box-shadow:0 12px 44px -8px rgba(var(--glow),calc(.5*var(--ga)))}
.tile.sm{height:60px;font-size:13px}
.orbt{height:236px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:36px;padding:0 40px;margin-bottom:26px;width:100%;text-align:left;transition:background .5s}
.orb{width:92px;height:92px;border-radius:50%;border:1px solid var(--fg);flex:none}
.orbt .big{font-size:46px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* shades */
.shades{display:flex;gap:30px;justify-content:center;padding:26px 72px 0}
.sh{width:300px;background:var(--card);border:1px solid var(--line);padding:26px;transition:background .5s}
.win{height:230px;border:1px solid var(--fg);position:relative;overflow:hidden;margin-bottom:22px}
.win::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.fab{position:absolute;left:0;right:0;top:0;background:var(--fg);opacity:.92}
.fab.sheer{opacity:.28;background:repeating-linear-gradient(90deg,var(--fg) 0 1px,transparent 1px 5px)}
.sh .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}
.sh .hd b{font-size:19px;font-weight:300}
.sh .hd span{font-size:13px;color:var(--mut);font-weight:400;font-variant-numeric:tabular-nums}
.sh .bt{display:flex;gap:10px}
.sh .bt .tile{flex:1;height:56px}

/* dial */
.climate{display:flex;align-items:center;justify-content:center;gap:70px;padding-top:20px}
.side{width:250px}
.dial{width:400px;height:400px;position:relative;touch-action:none}

.dial>svg{width:400px;height:400px;position:absolute;inset:0;overflow:visible}
.dial .arc{filter:drop-shadow(0 0 9px rgba(var(--glow),.75))}
.dial .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dial .sp{font-size:84px;font-weight:300;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;margin:12px 0 14px 18px}
.dial .pm{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:70px}
.stat{padding:18px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.stat b{font-size:24px;font-weight:300;font-variant-numeric:tabular-nums}

/* media + cinema */
.np{border-bottom:1px solid var(--line);padding-bottom:26px;margin-bottom:26px}
.np .ti{font-size:34px;font-weight:300;margin:14px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .su{font-size:15px;color:var(--mut);font-weight:400}
.prog{height:1px;background:var(--line);margin-top:26px;position:relative}
.prog i{position:absolute;left:0;top:-.5px;height:2px;background:var(--fg);box-shadow:0 0 10px rgba(var(--glow),.7)}
.trans{display:flex;gap:16px;align-items:center;margin:26px 0}
.trans .ib.pl{width:64px;height:64px}
.trans .ib.pl.on{background:var(--fg);color:var(--bg);box-shadow:0 0 34px rgba(var(--glow),calc(.5*var(--ga)))}
.scr{height:292px;border:1px solid var(--fg);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:box-shadow 1.6s,background 1.6s,color 1.6s;margin-bottom:22px}
.scr.on{background:var(--fg);color:var(--bg);box-shadow:0 0 110px -8px rgba(var(--glow),calc(.6*var(--ga)))}
.scr .mk{position:absolute;left:0;right:0;height:0;background:var(--bg);transition:height 1.4s cubic-bezier(.6,0,.2,1),background .5s}
.scr .mk.t{top:0}.scr .mk.b{bottom:0}
.scr.wide .mk{height:12.8%}
.scr .s1{font-size:26px;font-weight:300;letter-spacing:.04em}
.scr .s2{font-size:11px;letter-spacing:.26em;text-transform:uppercase;opacity:.6;font-weight:400}
.seq{margin:6px 0 22px}
.seq div{display:flex;align-items:center;gap:14px;height:38px;font-size:14px;color:var(--mut);font-weight:400;transition:color .5s}
.seq div b{width:8px;height:8px;border-radius:50%;border:1px solid var(--mut);transition:all .5s}
.seq div.ok{color:var(--fg)}
.seq div.ok b{background:var(--fg);border-color:var(--fg);box-shadow:0 0 12px 1px rgba(var(--glow),.85)}
.go{width:100%;height:76px;font-size:13px;letter-spacing:.28em;text-transform:uppercase}

/* demo mode */
.ghost{position:absolute;z-index:40;left:640px;top:880px;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:1.5px solid var(--fg);background:rgba(var(--glow),.14);box-shadow:0 0 26px rgba(var(--glow),.5);pointer-events:none;opacity:0;transition:left .75s cubic-bezier(.4,0,.2,1),top .75s cubic-bezier(.4,0,.2,1),opacity .4s,transform .16s}
.ghost.on{opacity:1}.ghost.dn{transform:scale(.68)}.ghost.drag{transition:opacity .4s,transform .16s}
.capt{position:absolute;z-index:39;left:0;right:0;top:31px;text-align:center;font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-weight:400;color:var(--fg);white-space:nowrap;opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .45s,transform .45s,color .5s}
.capt::after{content:'';display:block;width:22px;height:1px;margin:9px auto 0;background:var(--fg);box-shadow:0 0 8px rgba(var(--glow),.8)}
.capt.on{opacity:1;transform:none}
.open .pill{position:absolute;left:40px;top:16px}
.top .ib.dm.on{background:var(--fg);color:var(--bg);border-color:var(--fg);box-shadow:0 0 26px rgba(var(--glow),calc(.5*var(--ga)))}
