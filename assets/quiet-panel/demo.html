<style>/* from the design file */
#fit{position:absolute;left:0;top:0;width:1180px;height:820px;transform-origin:0 0}
body{margin:0;background:#0F0F0E}
a{color:inherit}a:hover{opacity:.8}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:1px solid currentColor;outline-offset:3px}
.tap{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;transition:transform .16s ease,background-color .35s ease,color .35s ease,opacity .35s ease,border-color .35s ease}
.tap:active{transform:scale(.985)}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.serif{font-family:'Shippori Mincho',serif}
.ruler{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin:0;cursor:pointer;display:block}
.ruler::-webkit-slider-runnable-track{height:12px;background:linear-gradient(90deg,var(--ink) 0,var(--ink) var(--p),var(--line) var(--p)) 0 100%/100% 2px no-repeat,repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 10%) 0 0/100% 7px no-repeat}
.ruler::-moz-range-track{height:2px;background:var(--line)}
.ruler::-moz-range-progress{height:2px;background:var(--ink)}
.ruler::-webkit-slider-thumb{-webkit-appearance:none;width:3px;height:22px;border-radius:1px;background:var(--ink);margin-top:-5px;box-shadow:0 0 10px var(--glow)}
.ruler::-moz-range-thumb{width:3px;height:22px;border:0;border-radius:1px;background:var(--ink)}
.face{transition:opacity .8s ease,transform 1.1s cubic-bezier(.65,0,.2,1),width 1.1s cubic-bezier(.65,0,.2,1),height 1.1s cubic-bezier(.65,0,.2,1)}
@keyframes eq{0%{transform:scaleY(.2)}100%{transform:scaleY(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}

<style>
/* One look: a 10" panel on a plaster wall. Screen 16:10, the UI (1180x820) scales inside it. */
:root {
  --wall: #d9d4cb; --wall-lit: #ece8e1; --wall-shade: #bdb6aa;
  --bezel: #121212; --bezel-edge: #2a2a2a; --ink: #2b2925; --muted: #6c675e;
  --ui: 'Inter', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: radial-gradient(120% 90% at 50% 18%, var(--wall-lit), var(--wall) 55%, var(--wall-shade)); color: var(--ink); font-family: var(--ui); -webkit-user-select: none; user-select: none; }
.stage { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
.device { position: relative; box-sizing: border-box; width: min(100%, calc((100dvh - 100px) * 1.55)); max-width: 1400px; padding: 2.2%; border-radius: clamp(10px, 2.2vw, 26px);
  background: linear-gradient(160deg, var(--bezel-edge), var(--bezel) 30%, #050505); box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 0 0 1px #000, 0 40px 70px -20px rgba(40,30,20,.55), 0 12px 24px rgba(40,30,20,.25); transition: padding .5s ease, border-radius .5s ease, width .5s ease; }
.device::before { content: ""; position: absolute; left: 50%; top: 0.9%; width: .5%; aspect-ratio: 1; border-radius: 50%; background: #1d2a33; box-shadow: 0 0 0 1px #000; transform: translateX(-50%); }
.screen { position: relative; width: 100%; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 3px; background: #121211; }
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(115deg, rgba(255,255,255,.07), rgba(255,255,255,0) 38%); transition: opacity .5s; }
#fit { touch-action: none; }
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; font-size: 12px; color: var(--muted); }
.bar b { font-family: var(--mono); font-weight: 400; letter-spacing: .14em; font-size: 10px; color: var(--ink); }
.btn { font: 500 12px var(--ui); letter-spacing: .02em; color: var(--ink); background: rgba(255,255,255,.55); border: 1px solid rgba(43,41,37,.25); border-radius: 16px; padding: 7px 13px; cursor: pointer; }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.hint { display: none; font-size: 12px; color: var(--muted); }
@media (orientation: portrait) {
  .device { width: min(100%, calc((100dvh - 110px) * 0.6)); }
  .screen { aspect-ratio: 10 / 16; }
}
/* phones held upright: the demo runs full screen like an app */
@media (orientation: portrait) and (max-width: 600px) {
  .stage { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); gap: 0; background: var(--theme-bg, #121211); }
  .device { width: 100%; height: 100%; max-width: none; padding: 0; border-radius: 0; background: var(--theme-bg, #121211); box-shadow: none; }
  .device::before, .screen::after, .bar, .hint, .exit { display: none !important; }
  .screen { aspect-ratio: auto; height: 100%; border-radius: 0; }
}
/* frameless: the UI fills the phone */
body.bare .stage { padding: 0; gap: 0; }
body.bare .device { width: 100%; height: 100%; max-width: none; padding: 0; border-radius: 0; background: #121211; box-shadow: none; }
body.bare .device::before, body.bare .screen::after, body.bare .bar, body.bare .hint { display: none; }
body.bare .screen { aspect-ratio: auto; height: 100%; border-radius: 0; }
.exit { display: none; position: fixed; z-index: 50; right: max(10px, env(safe-area-inset-right, 0px)); bottom: max(10px, env(safe-area-inset-bottom, 0px)); font: 500 11px var(--ui); color: #ECEAE4; background: rgba(18,18,17,.7); border: 1px solid #2B2A27; border-radius: 14px; padding: 6px 11px; cursor: pointer; }
body.bare .exit { display: block; }
@media (prefers-reduced-motion: reduce) { .device { transition: none; } }
</style>
